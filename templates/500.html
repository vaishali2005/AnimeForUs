{% extends "base.html" %}
      {% block title %} | 500 - Internal Server Error{% endblock %}
{% block extra_css %}
<link rel="stylesheet" href="{{url_for('static',filename = 'css/error-page.css')}}">

{% endblock %}
{% block content %}

<section class="error-page">
    <div class="error-container">

        <h1>500</h1>

        <h2>Something Went Wrong</h2>

        <p>
            We're having trouble loading this page right now.
            Please try again later.
        </p>

        <a href="{{ url_for('index') }}" class="primary-btn">
            Back to Home
        </a>

    </div>
</section>

{% endblock %}
